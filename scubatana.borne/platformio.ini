[platformio]
default_envs = borne

[env]
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.2.1

[env:borne]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *
lib_deps =
	${env.lib_deps}
	256dpi/MQTT@^2.5.2

[env:native]
platform = native
build_flags = -std=c++17
