services:
  mariadb:
    build:
      context: ./scubatana.mariadb
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build:
      context: ./scubatana.backend
    volumes:
      - laravel_code:/var/www/html
    depends_on:
      - mariadb
    restart: unless-stopped

  nginx:
    build:
      context: ./scubatana.nginx
    volumes:
      - laravel_code:/var/www/html:ro
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mariadb_data:
  laravel_code:
