x-laravel-environment: &laravel-environment
  APP_NAME: Scubanion
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-http://localhost:8000}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: Scubanion
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  MQTT_HOST: ${MQTT_HOST:-mosquitto}
  MQTT_PORT: "1883"
  MQTT_USERNAME: ${MQTT_USERNAME:-}
  MQTT_PASSWORD: ${MQTT_PASSWORD:-}

services:
  mariadb:
    build:
      context: ./scubatana.mariadb
    image: ${DOCKERHUB_NAMESPACE:-scubatana}/scubanion-mariadb:${IMAGE_TAG:-latest}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - donnees
    restart: unless-stopped

  mosquitto:
    build:
      context: ./scubatana.mosquitto
    image: ${DOCKERHUB_NAMESPACE:-scubatana}/scubanion-mosquitto:${IMAGE_TAG:-latest}
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mqtt_comptes:/mosquitto/comptes:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - iot
    restart: unless-stopped

  backend:
    build: &backend-build
      context: ./scubatana.backend
    image: ${DOCKERHUB_NAMESPACE:-scubatana}/scubanion-backend:${IMAGE_TAG:-latest}
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - mqtt_comptes:/var/www/html/storage/app/mqtt
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - donnees
      - web
      - iot
    restart: unless-stopped

  scheduler:
    build: *backend-build
    image: ${DOCKERHUB_NAMESPACE:-scubatana}/scubanion-backend:${IMAGE_TAG:-latest}
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-environment
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f schedule:work > /dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - donnees
    restart: unless-stopped

  bornes:
    build: *backend-build
    image: ${DOCKERHUB_NAMESPACE:-scubatana}/scubanion-backend:${IMAGE_TAG:-latest}
    command: ["php", "artisan", "bornes:ecouter"]
    environment:
      <<: *laravel-environment
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bornes-ecouter.heartbeat && test $$(expr $$(date +%s) - $$(cat /tmp/bornes-ecouter.heartbeat)) -le 60"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - donnees
      - iot
    restart: unless-stopped

  nginx:
    build:
      context: ./scubatana.nginx
      additional_contexts:
        backend: ./scubatana.backend
    image: ${DOCKERHUB_NAMESPACE:-scubatana}/scubanion-nginx:${IMAGE_TAG:-latest}
    ports:
      - "${NGINX_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./scubatana.prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - web
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./scubatana.grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scubatana.grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - web
    restart: unless-stopped

networks:
  donnees:
    internal: true
  iot:
  web:

volumes:
  mariadb_data:
  mosquitto_data:
  mqtt_comptes:
  prometheus_data:
  grafana_data:
