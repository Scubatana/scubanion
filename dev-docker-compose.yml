services:
  mariadb:
    build:
      context: ./scubatana.mariadb
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    build:
      context: ./scubatana.phpmyadmin
    environment:
      PMA_HOST: mariadb
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - mariadb

  mosquitto:
    build:
      context: ./scubatana.mosquitto
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./scubatana.backend/storage/app/mqtt:/mosquitto/comptes:ro

  frontend:
    build:
      context: ./scubatana.frontend
    volumes:
      - ./scubatana.frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:3000"
    env_file:
      - ./scubatana.frontend/.env

volumes:
  mariadb_data:
  mosquitto_data:
