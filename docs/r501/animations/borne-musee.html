<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scubanion Borne Musée (Copy)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Scène 16:9 (1920×1080) en calques superposés : chaque grand mouvement (caméra, téléphone) est un calque
   déplacé par la carte graphique, sans redessin. Vue subjective, un seul thème assumé. */
:root{
  --encre:#1E3A42; --encre-douce:#4C6B73; --ocean:#2F6B7A; --ocean-fonce:#204E5A;
  --ocean-clair:#8FB9C2; --brume:#DCEBEE; --papier:#F5FAFB; --corail:#F0855A;
  --corail-fonce:#D96A41; --blanc:#FFFFFF; --led:#34C77B; --nuit:#16282E;
  --titre:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --texte:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--nuit);color:var(--encre);display:grid;place-items:center}
.stage{position:relative;width:min(100vw,calc(100dvh * 16 / 9));aspect-ratio:16/9;max-width:100%;background:var(--papier);overflow:hidden;user-select:none}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
svg.layer{overflow:visible}
#cam{will-change:transform;transform-origin:50% 39.8%}
#phoneL{will-change:transform;transform-origin:50% 12.685%}
#vig{background:radial-gradient(ellipse 75% 75% at 50% 45%,rgba(22,40,46,0) 55%,rgba(22,40,46,.3) 100%)}
#dim{background:var(--nuit);opacity:0;will-change:opacity}
#veil{background:var(--papier);will-change:opacity}
#appL,#endL{will-change:opacity}
.b{font-family:var(--titre)} .i{font-family:var(--texte)}
#replay{position:absolute;right:2.2%;bottom:3.2%;font:600 clamp(11px,1.5vw,22px) var(--titre);color:var(--ocean);
  background:var(--blanc);border:2px solid var(--ocean-clair);border-radius:12px;padding:.35em 1em;cursor:pointer;opacity:0;visibility:hidden}
#replay:hover{background:var(--brume)}
#replay:focus-visible{outline:3px solid var(--corail);outline-offset:3px}

/* Boucles d'ambiance du compagnon (repos) */
.float{animation:float 3.4s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 2.8s ease-in-out infinite}
.w1,.w2,.w3{animation:wifi 2.4s ease-in-out infinite}
.w2{animation-delay:.25s}.w3{animation-delay:.5s}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes wifi{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){ .float,.blink,.breathe,.w1,.w2,.w3{animation:none} }
</style>

<div class="stage" role="img" aria-label="Démonstration Scubanion en vue subjective : on pose son téléphone sur une borne de musée et le Chapeau du Portrait arrive sur le compagnon">

</defs></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ================= RÉGLAGES : durée de chaque scène, en secondes ================= */
const D = {
  marche:     1.8,  // 1. On avance vers le tableau, téléphone en main, borne au repos
  pose:       1.3,  // 2. On pose le téléphone sur la zone NFC de la borne
  chargement: 2.2,  // 3. Le tableau s'affiche sur la borne, les LED vertes remplissent l'anneau jusqu'à 100 %
  bulle:      2.5,  // 4. Pop : la bulle sort le chapeau de l'image, descend, sort par le bas de l'écran, entre dans le téléphone
  telephone:  2.2,  // 5. Le téléphone revient vers nous : « DÉBLOQUÉ ! »
  app:        3.4,  // 6. Écran « Nouvel objet » en portrait, appui sur « Équiper »
  fin:        0.8   //    Fondu vers le logo et le slogan
};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const INK = '#1E3A42';
const lerp = (a, b, t) => a + (b - a) * t;

/* ================= DESSINS RÉUTILISÉS ================= */
// Le haut-de-forme : un seul dessin, du tableau jusqu'au compagnon. Origine au centre du bord.
function hatSVG(){
  return `<ellipse cx="0" cy="0" rx="60" ry="13" fill="#161B1F" stroke="${INK}" stroke-width="6"/>
  <path d="M-40,-4 L-35,-88 Q0,-99 35,-88 L40,-4 Q0,8 -40,-4Z" fill="#161B1F" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
  <path class="ribbon" d="M-40,-6 L-38.5,-31 Q0,-21 38.5,-31 L40,-6 Q0,6 -40,-6Z" fill="#F0855A" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
  <path class="shine" d="M-23,-80 L-26,-40" stroke="#fff" opacity=".3" stroke-width="6" stroke-linecap="round"/>`;
}
// Le personnage du portrait (centré sur x = 960), repris tel quel sur le mur, sur l'écran de la borne et dans la bulle.
function portraitSVG(){
  return `<path d="M815,495 Q826,402 912,386 L1008,386 Q1094,402 1105,495Z" fill="#2B3A4A"/>
  <path d="M860,495 Q870,430 912,400" stroke="#3E5266" stroke-width="10" fill="none" stroke-linecap="round"/>
  <rect x="941" y="345" width="38" height="50" fill="#D7A680"/>
  <path d="M922,386 L960,430 L998,386 L980,378 L960,396 L940,378Z" fill="#F2EDE2"/>
  <path d="M950,400 L970,400 L976,440 L960,456 L944,440Z" fill="#6E4636"/>
  <ellipse cx="960" cy="305" rx="46" ry="56" fill="#E4B58F"/>
  <path d="M914,300 Q908,340 926,356 Q918,320 922,292Z M1006,300 Q1012,340 994,356 Q1002,320 998,292Z" fill="#4A3426"/>
  <ellipse cx="943" cy="302" rx="4.5" ry="5.5" fill="#1E3A42"/><ellipse cx="977" cy="302" rx="4.5" ry="5.5" fill="#1E3A42"/>
  <path d="M934,290 Q943,285 952,290 M968,290 Q977,285 986,290" stroke="#4A3426" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M960,306 Q954,322 962,324" stroke="#C48F68" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M934,334 Q960,318 986,334 Q960,344 934,334Z" fill="#4A3426"/>
  <circle cx="930" cy="322" r="9" fill="#E79A7E" opacity=".45"/><circle cx="990" cy="322" r="9" fill="#E79A7E" opacity=".45"/>
  <g transform="translate(960,258) scale(1.05)">${hatSVG()}</g>`;
}
// Le compagnon, origine au centre du corps (rayon 100).
function compSVG(id, withHat, isStatic){
  const s = `stroke="${INK}" stroke-linejoin="round" stroke-linecap="round"`;
  return `<g class="${isStatic ? '' : 'float'}"><g class="comp" id="${id}"><g class="spin">
    <path class="finL" d="M-86,8 Q-140,-44 -160,-30 Q-142,2 -150,18 Q-168,44 -152,64 Q-118,62 -84,42Z" fill="#6FA3AF" ${s} stroke-width="7"/>
    <path d="M-70,70 L-100,106 Q-70,106 -46,90Z M70,70 L100,106 Q70,106 46,90Z" fill="#6FA3AF" ${s} stroke-width="7"/>
    <path d="M-16,-95 Q10,-162 20,-160 Q38,-126 50,-84Z" fill="#7FAFB9" ${s} stroke-width="7"/>
    <circle r="100" fill="url(#gBody)" stroke="${INK}" stroke-width="7"/>
    <ellipse cx="0" cy="68" rx="56" ry="25" fill="#EEF6F7"/>
    <path d="M-62,-64 Q-48,-84 -24,-91" fill="none" stroke="#fff" stroke-width="8" opacity=".6" stroke-linecap="round"/>
    <path d="M-96,-30 L96,-30 L99,-4 L-99,-4Z" fill="#5E9A8F" ${s} stroke-width="5"/>
    <rect x="-72" y="-58" width="144" height="80" rx="36" fill="#7FB5A8" stroke="${INK}" stroke-width="6"/>
    <rect x="-60" y="-47" width="120" height="58" rx="27" fill="#DDF0F2" stroke="${INK}" stroke-width="4"/>
    <path d="M-48,-28 L-38,-40" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <g class="eyesOpen"><g class="blink">
      <ellipse cx="-26" cy="-17" rx="11" ry="15" fill="#12232A"/><ellipse cx="26" cy="-17" rx="11" ry="15" fill="#12232A"/>
      <circle cx="-22" cy="-23" r="4.2" fill="#fff"/><circle cx="30" cy="-23" r="4.2" fill="#fff"/>
    </g></g>
    <path class="eyesHappy" d="M-38,-12 Q-26,-30 -14,-12 M14,-12 Q26,-30 38,-12" fill="none" stroke="#12232A" stroke-width="7" stroke-linecap="round" opacity="0"/>
    <path d="M-15,13 Q0,-10 15,13Z" fill="#7FB5A8" ${s} stroke-width="5"/>
    <path d="M92,-128 L92,18 Q92,50 58,50 L14,48" fill="none" stroke="${INK}" stroke-width="23" stroke-linecap="round"/>
    <path d="M92,-128 L92,18 Q92,50 58,50 L14,48" fill="none" stroke="#7FB5A8" stroke-width="12" stroke-linecap="round"/>
    <rect x="79" y="-30" width="26" height="22" rx="5" fill="#5E9A8F" stroke="${INK}" stroke-width="5"/>
    <circle cx="6" cy="48" r="14" fill="#A9CCD3" stroke="${INK}" stroke-width="5"/><circle cx="6" cy="48" r="4.5" fill="${INK}"/>
    <g fill="none" stroke="#2F6B7A" stroke-width="8" stroke-linecap="round">
      <path class="w1" d="M80.7,-153.3 A16,16 0 0 1 103.3,-153.3"/>
      <path class="w2" d="M70.8,-163.2 A30,30 0 0 1 113.2,-163.2"/>
      <path class="w3" d="M60.9,-173.1 A44,44 0 0 1 123.1,-173.1"/>
    </g>
    <g class="hat" transform="translate(-18,-90) rotate(-14)" opacity="${withHat ? 1 : 0}">${hatSVG()}</g>
  </g></g></g>`;
}
document.querySelectorAll('[data-portrait]').forEach(g => { g.innerHTML = portraitSVG(); });
document.querySelectorAll('[data-hat]').forEach(g => {
  g.innerHTML = hatSVG();
  if (g.hasAttribute('data-sil')) g.querySelectorAll('*').forEach(p => {   // silhouette sur l'écran de la borne
    p.setAttribute('fill', p.classList.contains('shine') ? 'none' : '#8FB9C2');
    p.setAttribute('stroke', p.classList.contains('shine') ? 'none' : '#2F6B7A');
  });
});
document.querySelectorAll('[data-comp]').forEach(g => {
  g.innerHTML = compSVG(g.dataset.comp, g.hasAttribute('data-withhat'), g.hasAttribute('data-static'));
});
// Ombres douces sans filtre
document.querySelectorAll('[data-sh]').forEach(g => {
  const [x, y, w, h, r, o] = g.dataset.sh.split(',').map(Number);
  g.innerHTML = [6, 14, 24, 36].map(k => `<rect x="${x - k / 2}" y="${y + k * .7}" width="${w + k}" height="${h + k * .2}" rx="${r + k / 2}" fill="#16282E" opacity="${o}"/>`).join('');
});
// QR code décoratif (motif fixe, à remplacer par le vrai QR du site)
(function(){
  const n = 21, m = 4, ox = 1074, oy = 440; let seed = 42, d = '';
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const finder = (r, c) => { for (const [fr, fc] of [[0, 0], [0, n - 7], [n - 7, 0]]) { const a = r - fr, b = c - fc;
    if (a >= -1 && a <= 7 && b >= -1 && b <= 7) return (a >= 0 && a <= 6 && b >= 0 && b <= 6 && (a === 0 || a === 6 || b === 0 || b === 6 || (a >= 2 && a <= 4 && b >= 2 && b <= 4))) ? 1 : 0; } return -1; };
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++){
    const f = finder(r, c), on = f >= 0 ? f : (r === 6 || c === 6 ? (r + c) % 2 === 0 : rnd() > .52);
    if (on) d += `M${ox + c * m},${oy + r * m}h${m}v${m}h${-m}z`;
  }
  $('#qr').setAttribute('d', d);
})();
// Anneau de LED autour de la zone NFC. Le téléphone posé cache le bas de l'anneau :
// le remplissage part donc du bord gauche du téléphone, passe par le haut, et finit au bord droit.
const NLED = 40, LEDS = [], LED_START = 236, LED_SPAN = 248, LED_R = 92;
(function(){
  let h = '';
  for (let i = 0; i < NLED; i++){
    const deg = i / NLED * 360, a = deg * Math.PI / 180 - Math.PI / 2;
    h += `<circle cx="${(1340 + LED_R * Math.cos(a)).toFixed(1)}" cy="${(482 + LED_R * Math.sin(a)).toFixed(1)}" r="4.6" fill="#D2E1E5"/>`;
    const rel = (deg - LED_START + 360) % 360;
    LEDS.push({fv: rel / LED_SPAN, fc: rel / 360});
  }
  $('#ledDots').innerHTML = h;
  document.querySelectorAll('#ledDots circle').forEach((c, i) => LEDS[i].el = c);
})();
// Confettis corail et océan, gouttelettes de la bulle
const CONF = [], DROPS = [];
(function(){
  const cols = ['#F0855A', '#D96A41', '#2F6B7A', '#8FB9C2', '#F0855A'];
  let h = '';
  for (let i = 0; i < 40; i++){
    const a = Math.random() * Math.PI * 2, d = 200 + Math.random() * 380;
    CONF.push({dx: Math.cos(a) * d, dy: Math.sin(a) * d - 80, r: Math.random() * 540 - 270, fall: 160 + Math.random() * 220});
    h += i % 3 ? `<rect class="cf" x="952" y="424" width="17" height="10" rx="2" fill="${cols[i % 5]}" opacity="0"/>`
               : `<circle class="cf" cx="960" cy="430" r="7" fill="${cols[i % 5]}" opacity="0"/>`;
  }
  $('#confetti').innerHTML = h;
  h = '';
  for (let i = 0; i < 10; i++){
    const a = i / 10 * Math.PI * 2 + .3;
    DROPS.push({dx: Math.cos(a) * (46 + (i % 3) * 12), dy: Math.sin(a) * (46 + (i % 3) * 12)});
    h += `<circle class="dp" cx="1336" cy="556" r="${3.5 + (i % 3) * 1.5}" fill="#BFE3EA" opacity="0"/>`;
  }
  $('#droplets').innerHTML = h;
})();

/* ================= ÉLÉMENTS PILOTÉS À LA MAIN (positions exactes) ================= */
// Repère de la borne → écran : la borne est dessinée à l'échelle 1 puis réduite.
const BK = .75, BX = 335, BY = 125;
// Téléphone : (x, y) = position à l'écran de son antenne NFC, s = taille (1 = près de nous).
// Le calque est dessiné à la taille 1.3 et déplacé en CSS : aucun redessin pendant ses mouvements.
const ph = {x: 960, y: 680, r: -5, s: 1};
const POSE_B = {x: 1340, y: 482, s: .4};                                            // pose, dans le repère de la borne
const POSE = {x: POSE_B.x * BK + BX, y: POSE_B.y * BK + BY, s: POSE_B.s * BK};      // pose, à l'écran
const phoneEl = $('#phoneL');
function upPhone(){
  phoneEl.style.transform = `translate(${((ph.x - 960) / 19.2).toFixed(4)}%,${((ph.y - 137) / 10.8).toFixed(4)}%) rotate(${ph.r.toFixed(3)}deg) scale(${(ph.s / 1.3).toFixed(5)})`;
}

// LED : spin = position de la tête lumineuse, fill = remplissage 0 à 1
const led = {spin: 0, speed: .22, comet: 1, green: 0, fill: 0, flash: 0};
let lastPct = -1, lastSig = '';
function upLed(){
  const sig = `${led.spin.toFixed(3)}|${led.comet.toFixed(2)}|${led.green.toFixed(2)}|${led.fill.toFixed(3)}|${led.flash.toFixed(2)}`;
  if (sig === lastSig) return;                                                       // rien n'a bougé : pas de redessin
  lastSig = sig;
  const head = ((led.spin % 1) + 1) % 1;
  for (let i = 0; i < NLED; i++){
    const L = LEDS[i], behind = (head - L.fc + 1) % 1;
    let g = behind < .3 ? (1 - behind / .3) * led.comet : 0;
    const filled = led.fill >= 1 || L.fv < led.fill - 1e-4;
    if (filled) g = 1;
    const gr = filled ? 1 : led.green, k = led.flash;
    // éteinte → océan clair (repos) ou vert (lecture), puis éclat presque blanc au flash
    const R = lerp(lerp(210, lerp(94, 52, gr), g), 205, k), G = lerp(lerp(225, lerp(151, 199, gr), g), 255, k), B = lerp(lerp(229, lerp(163, 123, gr), g), 225, k);
    L.el.setAttribute('fill', `rgb(${R | 0},${G | 0},${B | 0})`);
    L.el.setAttribute('r', (4.6 + 1.5 * g + 1.1 * k).toFixed(2));
  }
  const glow = $('#ledGlow'), f = Math.min(1, led.fill);
  glow.setAttribute('stroke-dasharray', `${(f * LED_SPAN / 360 * 2 * Math.PI * LED_R).toFixed(1)} 999`);
  glow.setAttribute('opacity', (led.fill > 0 ? .2 + .45 * led.flash : 0).toFixed(3));
  glow.setAttribute('stroke-width', (26 + 18 * led.flash).toFixed(1));
  const p = Math.round(f * 100);
  if (p !== lastPct){ lastPct = p; $('#pct').textContent = p; }
}

// Bulle (repère de la borne) : r = rayon, m = grossissement de l'image au moment du pop, lo = image visible dedans,
// fo = bulle teintée, ho / hs / hr = chapeau, sx / sy = déformation, sh = ombre portée une fois sortie de l'écran
const HAT_END = {x: 1340 - 18 * .78 * POSE_B.s, y: 482 + (345 - 60) * POSE_B.s - 90 * .78 * POSE_B.s, s: .78 * POSE_B.s};  // sur le compagnon du téléphone posé
const POP_M = 1.6;
const bub = {x: 1340, y: 200, r: 0, m: 1, lo: 1, fo: 0, ho: 0, hs: 1.05 * POP_M, hr: 0, sx: 1, sy: 1, sh: 0, o: 0};
const E = {};
['lensC', 'lensIn', 'lens', 'bubFill', 'bubRim', 'bubShine', 'bubShadow', 'bubHat'].forEach(id => E[id] = document.getElementById(id));
function upBub(){
  const bx = bub.x, by = bub.y, rx = Math.max(0, bub.r * bub.sx), ry = Math.max(0, bub.r * bub.sy);
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  set(E.lensC, {cx: bx, cy: by, r: Math.max(0, bub.r).toFixed(1)});
  E.lensIn.setAttribute('transform', `translate(1340,200) scale(${bub.m.toFixed(4)}) translate(-1340,-200)`);
  E.lens.setAttribute('opacity', bub.lo);
  set(E.bubFill, {cx: bx, cy: by, rx: rx.toFixed(1), ry: ry.toFixed(1), opacity: .45 * bub.fo});
  set(E.bubRim, {cx: bx, cy: by, rx: Math.max(0, rx - 5).toFixed(1), ry: Math.max(0, ry - 5).toFixed(1), opacity: .7 * bub.o});
  set(E.bubShine, {cx: bx - rx * .42, cy: by - ry * .46, rx: (rx * .2).toFixed(1), ry: (ry * .1).toFixed(1),
    transform: `rotate(-35 ${bx - rx * .42} ${by - ry * .46})`, opacity: .8 * bub.o});
  set(E.bubShadow, {cx: bx + 10, cy: by + ry * .95 + 12, rx: (rx * .8).toFixed(1), ry: (ry * .16).toFixed(1), opacity: .13 * bub.sh * bub.o});
  set(E.bubHat, {transform: `translate(${bx},${by + 45 * bub.hs}) rotate(${bub.hr}) scale(${bub.hs * bub.sx},${bub.hs * bub.sy})`, opacity: bub.ho});
}
function upAll(){ lastSig = ''; upPhone(); upLed(); upBub(); }
upAll();

/* ================= ANIMATION ================= */
if (window.gsap) {
  gsap.ticker.lagSmoothing(0);                                                       // la timeline suit l'horloge réelle, sans à-coups de rattrapage
  const tl = gsap.timeline({paused: true});
  // F : fondu ou changement de couleur. M : mouvement, remplacé par un saut net si « mouvement réduit ».
  const F = (t, v, p) => tl.to(t, v, p);
  const M = (t, v, p) => tl.to(t, RM ? {...v, duration: .001, yoyo: false, repeat: 0} : v, p);
  const P = (v, p) => M(ph, {...v, onUpdate: upPhone}, p);
  const BB = (v, p) => M(bub, {...v, onUpdate: upBub}, p);

  // Les LED tournent en continu (vitesse et couleur pilotées par la timeline)
  if (RM) { led.comet = 0; led.speed = 0; }
  gsap.ticker.add((t, dt) => { led.spin += led.speed * dt / 1000; upLed(); });

  // États de départ
  gsap.set('#cam', {scale: .86, force3D: true});
  gsap.set('#dbl', {scale: .3, transformOrigin: '50% 50%'});
  gsap.set('.nfcW', {scale: .5, transformOrigin: '50% 50%'});
  gsap.set('#lip', {scale: .4, transformOrigin: '50% 50%'});
  gsap.set('#phApp', {x: 70});
  gsap.set('#tapRing', {scale: .3, transformOrigin: '50% 50%'});
  gsap.set('#sideL', {x: -50});
  gsap.set('#sideR', {scale: .4, transformOrigin: '0% 50%'});
  gsap.set('#endCompIn', {scale: .7, transformOrigin: '50% 50%'});
  gsap.set('#endText', {y: 36, opacity: 0});
  gsap.set('#replay', {autoAlpha: 0});

  // Le compagnon content : écrasement, rebond, vrille, yeux souriants
  function happy(id, t, turn){
    F(`#${id} .eyesOpen`, {opacity: 0, duration: .1}, t);
    F(`#${id} .eyesHappy`, {opacity: 1, duration: .1}, t);
    M(`#${id}`, {scaleY: .78, scaleX: 1.16, duration: .14, ease: 'power2.out', transformOrigin: '50% 100%'}, t);
    M(`#${id}`, {scaleY: 1.12, scaleX: .92, y: -46, duration: .26, ease: 'power2.out'}, t + .14);
    M(`#${id} .spin`, {rotation: 360 * turn, duration: .62, ease: 'power2.inOut', transformOrigin: '50% 50%'}, t + .14);
    M(`#${id}`, {scaleY: 1, scaleX: 1, y: 0, duration: .8, ease: 'elastic.out(1,.45)'}, t + .42);
  }

  const T1 = D.marche, T2 = T1 + D.pose, T3 = T2 + D.chargement, T4 = T3 + D.bulle,
        T5 = T4 + D.telephone, T6 = T5 + D.app;

  /* ---------- Scène 1 : on avance vers le tableau ---------- */
  F('#veil', {opacity: 0, duration: .9, ease: 'power1.out'}, 0);
  M('#cam', {scale: 1, duration: T2, ease: 'sine.inOut'}, 0);                        // la caméra avance jusqu'au contact
  P({y: 650, r: -3, duration: T1 * .5, ease: 'sine.inOut'}, 0);                      // léger balancement de la marche
  P({y: 672, r: -5, duration: T1 * .5, ease: 'sine.inOut'}, T1 * .5);

  /* ---------- Scène 2 : on pose le téléphone sur la zone NFC ---------- */
  P({x: POSE.x, y: POSE.y, r: 0, s: POSE.s, duration: D.pose, ease: 'power2.inOut'}, T1);
  F('#phShadow', {opacity: .28, duration: .4}, T2 - .4);
  P({s: POSE.s - .01, duration: .09, ease: 'power1.out', yoyo: true, repeat: 1}, T2);    // petit contact
  tl.to('.nfcW', {scale: 1, opacity: 0, duration: .8, ease: 'power2.out', stagger: .3, startAt: {opacity: .8}}, T2);

  /* ---------- Scène 3 : le tableau s'affiche, les LED vertes remplissent l'anneau ---------- */
  tl.to(led, {green: 1, speed: 1.3, duration: .35, ease: 'power1.out'}, T2);
  F('#bsIdle', {opacity: 0, duration: .2}, T2);
  F('#bsPaint', {opacity: 1, duration: .5, ease: 'power1.inOut'}, T2 + .1);
  const L = D.chargement - .45;                                                      // progression avec un léger palier, comme une vraie lecture
  tl.to(led, {fill: .4, duration: L * .38, ease: 'power1.inOut'}, T2 + .25);
  tl.to(led, {fill: .74, duration: L * .34, ease: 'power1.inOut'}, T2 + .25 + L * .38);
  tl.to(led, {fill: 1, duration: L * .28, ease: 'power2.in'}, T2 + .25 + L * .72);
  tl.to(led, {comet: 0, speed: 0, duration: .15}, T3 - .2);
  tl.to(led, {flash: 1, duration: .14, ease: 'power2.out', yoyo: true, repeat: 1}, T3 - .2);   // 100 % : éclat de l'anneau
  F('#pctBg', {fill: '#34C77B', opacity: 1, duration: .15}, T3 - .2);
  F('#pctChip', {opacity: 0, duration: .3}, T3 + .25);

  /* ---------- Scène 4 : pop, la bulle sort le chapeau de l'image et l'emmène au compagnon ---------- */
  const TB = T3 + .05;
  tl.set('#bubTop', {display: 'block'}, TB - .02);
  BB({o: 1, duration: .12}, TB);
  BB({r: 84, m: POP_M, duration: .22, ease: 'back.out(2.5)'}, TB);                   // pop : l'image gonfle d'un coup autour du chapeau
  const SN = TB + .24;                                                               // la bulle se détache avec le chapeau
  BB({lo: 0, fo: 1, ho: 1, duration: .1, ease: 'power1.in'}, SN);
  BB({hs: 1, r: 76, duration: .5, ease: 'elastic.out(1,.5)'}, SN + .04);
  BB({y: 296, duration: .44, ease: 'sine.inOut'}, SN + .18);                         // elle descend dans l'écran
  BB({y: 392, sx: .74, sy: 1.22, duration: .26, ease: 'power2.in'}, SN + .62);       // elle se faufile par le bas de l'écran, au milieu
  tl.to('#lip', {scale: 1.3, opacity: 0, duration: .5, ease: 'power2.out', startAt: {opacity: .9}}, SN + .7);
  BB({y: 436, sx: 1.16, sy: .88, sh: 1, duration: .16, ease: 'power2.out'}, SN + .88);   // elle ressort, bien réelle
  BB({sx: 1, sy: 1, duration: .5, ease: 'elastic.out(1.2,.3)'}, SN + 1.04);
  BB({y: 522, r: 36, hs: .44, sh: 0, duration: .4, ease: 'power2.inOut'}, SN + 1.08);    // elle entre par le haut du téléphone
  BB({x: HAT_END.x, y: HAT_END.y - 45 * HAT_END.s, r: 30, hs: HAT_END.s, hr: -14, duration: .24, ease: 'sine.inOut'}, SN + 1.48);
  const POP = SN + 1.74;                                                             // elle éclate sur le compagnon
  BB({r: 0, o: 0, duration: .14, ease: 'back.in(3)'}, POP);
  DROPS.forEach((c, i) => {
    if (RM) return;
    tl.fromTo(document.querySelectorAll('.dp')[i], {x: 0, y: 0, opacity: .9}, {x: c.dx, y: c.dy, opacity: 0, duration: .45, ease: 'power2.out', immediateRender: false}, POP + .08);
  });
  F('#phComp .hat', {opacity: 1, duration: .05}, POP + .1);
  BB({ho: 0, duration: .04}, POP + .13);
  tl.set('#bubTop', {display: 'none'}, POP + .3);
  happy('phComp', POP + .12, 1);
  F('#bsDone', {opacity: 1, duration: .4}, POP + .1);
  M('#miniB .finL', {rotation: -28, transformOrigin: '100% 50%', duration: .16, yoyo: true, repeat: 7, ease: 'sine.inOut'}, POP + .5);

  /* ---------- Scène 5 : le téléphone revient vers nous, « DÉBLOQUÉ ! » ---------- */
  F('#phShadow', {opacity: 0, duration: .25}, T4);
  P({x: 960, y: 183, s: 1.15, r: 0, duration: 1, ease: 'power2.inOut'}, T4);
  F('#dim', {opacity: .4, duration: .8, ease: 'power1.inOut'}, T4 + .1);
  const UN = T4 + .8;
  F('#phHome', {opacity: 0, duration: .2}, UN - .1);
  F('#phUnlock', {opacity: 1, duration: .2}, UN);
  M('#dbl', {scale: 1, duration: .55, ease: 'back.out(2.6)'}, UN);
  CONF.forEach((c, i) => {
    const el = document.querySelectorAll('.cf')[i];
    if (RM) { gsap.set(el, {x: c.dx, y: c.dy}); F(el, {opacity: 1, duration: .3}, UN); F(el, {opacity: 0, duration: .5}, UN + .7); return; }
    tl.fromTo(el, {x: 0, y: 0, rotation: 0, scale: .3, opacity: 1, transformOrigin: '50% 50%'},
      {x: c.dx, y: c.dy, rotation: c.r, scale: 1, duration: .7, ease: 'power3.out', immediateRender: false}, UN + .05);
    tl.to(el, {y: c.dy + c.fall, opacity: 0, duration: .8, ease: 'power1.in'}, UN + .7);
  });

  /* ---------- Scène 6 : l'app en portrait, dans le téléphone ---------- */
  F('#thumb', {opacity: 0, duration: .3}, T5);
  F('#handBack', {opacity: 0, duration: .3}, T5);
  F('#appL', {opacity: 1, duration: .55, ease: 'power1.inOut'}, T5);
  P({x: 960, y: 137, s: 1.3, duration: .8, ease: 'power2.inOut'}, T5);               // le téléphone se centre, plein cadre en hauteur
  F('#phUnlock', {opacity: 0, duration: .25}, T5 + .15);
  F('#phHeader', {opacity: 0, duration: .2}, T5 + .15);
  F('#phApp', {opacity: 1, duration: .3}, T5 + .3);
  M('#phApp', {x: 0, duration: .55, ease: 'power3.out'}, T5 + .3);
  M('#phCompPos', {y: -112, scale: .82, transformOrigin: '50% 50%', duration: .6, ease: 'back.out(1.4)'}, T5 + .25);
  F('#sideL', {opacity: 1, duration: .4}, T5 + .55);
  M('#sideL', {x: 0, duration: .6, ease: 'power3.out'}, T5 + .55);
  const TAP = T5 + 1.5;                                                              // appui sur « Équiper »
  F('#tapDot', {opacity: .55, duration: .12}, TAP - .12);
  F('#tapDot', {opacity: 0, duration: .25}, TAP + .1);
  tl.to('#tapRing', {scale: 1, opacity: 0, duration: .55, ease: 'power2.out', startAt: {opacity: .7}}, TAP);
  M('#btnEq', {scale: .95, transformOrigin: '50% 50%', duration: .1, yoyo: true, repeat: 1, ease: 'power1.inOut'}, TAP);
  F('#btnEqT1', {opacity: 0, duration: .1}, TAP + .1);
  F('#btnEqT2', {opacity: 1, duration: .15}, TAP + .15);
  F('#btnEqBg', {fill: '#204E5A', duration: .2}, TAP + .1);
  happy('phComp', TAP + .2, 2);
  F('#sideR', {opacity: 1, duration: .2}, TAP + .75);
  M('#sideR', {scale: 1, duration: .5, ease: 'back.out(2.2)'}, TAP + .75);

  /* ---------- Fin : logo et slogan ---------- */
  F('#endL', {opacity: 1, duration: D.fin, ease: 'power1.inOut'}, T6);
  M('#endCompIn', {scale: 1, duration: .8, ease: 'back.out(1.7)'}, T6 + .2);
  F('#endText', {opacity: 1, duration: .5}, T6 + .45);
  M('#endText', {y: 0, duration: .6, ease: 'back.out(1.5)'}, T6 + .45);
  F('#replay', {autoAlpha: 1, duration: .4}, T6 + D.fin + .6);

  $('#replay').addEventListener('click', () => { tl.pause(0); upAll(); tl.play(); });
  window.__tl = tl; window.__upAll = upAll;
  const start = () => tl.play();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start, start);
} else {
  // GSAP indisponible : on montre la scène du musée, fixe.
  $('#veil').style.opacity = 0;
}
</script>

</body></html>
