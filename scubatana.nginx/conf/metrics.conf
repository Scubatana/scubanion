server {
	listen 9091;
	server_name _;

	# Comme dans default.conf : n'importe quelle réplique de backend répond, car les métriques sont lues en base.
	resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
	set $backend backend:9000;

	location = /metrics {
		access_log off;
		include fastcgi_params;
		fastcgi_pass $backend;
		fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
		fastcgi_param SCRIPT_NAME /index.php;
		fastcgi_param REQUEST_URI /metrics;
		fastcgi_param SCUBANION_INTERNAL_METRICS "1";
	}

	location / {
		return 404;
	}
}
