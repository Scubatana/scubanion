server {
	listen 80;
	server_name _;
	root /var/www/html/public;
	index index.php;

	# Le nom backend est résolu à nouveau toutes les 10 s par le DNS de Docker, qui renvoie une adresse par
	# réplique : les requêtes sont réparties entre toutes, même après un changement du nombre de répliques.
	# Le résolveur est rempli au démarrage depuis /etc/resolv.conf (voir le Dockerfile).
	resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
	set $backend backend:9000;

	location = /healthz {
		access_log off;
		return 200 "ok\n";
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location ~ \.php$ {
		fastcgi_pass $backend;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_param REMOTE_ADDR $remote_addr;
		fastcgi_param HTTP_X_REAL_IP $remote_addr;
		fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
	}

	location ~ /\.(?!well-known) {
		deny all;
	}
}
