name: Fonctionnalité
description: Une exigence du cahier des charges à réaliser, ou une idée à cadrer.
title: "feat: "
labels: [enhancement]
body:
  - type: input
    id: exigence
    attributes:
      label: Exigence
      description: Numéro dans le cahier des charges, s'il existe. Sinon, l'issue sert à la cadrer avant de l'y ajouter.
      placeholder: APP-10, BOR-09...
  - type: dropdown
    id: brique
    attributes:
      label: Brique concernée
      multiple: true
      options:
        - App Android
        - API
        - Borne
        - CI/CD et déploiement
        - Supervision
        - Business (R5.01, R5.13)
    validations:
      required: true
  - type: dropdown
    id: priorite
    attributes:
      label: Priorité
      options:
        - Must
        - Should
        - Could
    validations:
      required: true
  - type: textarea
    id: besoin
    attributes:
      label: Besoin
      description: Pour qui et pourquoi (le joueur, un partenaire, l'équipe).
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: Ce qui doit être vrai pour fermer l'issue.
      value: |
        - [ ] ...
        - [ ] Tests
        - [ ] Documentation (API, cahier des charges)
    validations:
      required: true
