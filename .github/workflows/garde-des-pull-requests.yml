name: Garde des pull requests

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
  push:
    branches: [develop, master, main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: garde-${{ github.event.pull_request.number || github.ref }}

jobs:
  base:
    name: Branche cible
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: N'accepter que develop, et la PR de release develop → master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$BASE" = "develop" ]; then
            exit 0
          fi

          if [ "$BASE" = "master" ] || [ "$BASE" = "main" ]; then
            if [ "$HEAD" = "develop" ] && [ "$SAME_REPO" = "true" ]; then
              exit 0
            fi

            # Tant que develop n'existe pas (avant .github/scripts/configurer-flux-develop.sh), master reste la cible.
            if ! gh api "repos/$GH_REPO/branches/develop" > /dev/null 2>&1; then
              exit 0
            fi

            gh pr edit "$NUMBER" --base develop
            gh pr comment "$NUMBER" --body "Cette PR visait \`$BASE\` : elle a été redirigée vers \`develop\`. Les branches de travail fusionnent dans \`develop\` ; seule la PR de release \`develop\` → \`$BASE\` vise \`$BASE\` (voir CONTRIBUTING.md)."
            exit 0
          fi

          gh pr close "$NUMBER" --comment "Cette PR vise \`$BASE\`. Les pull requests visent \`develop\` (ou \`master\` pour la seule PR de release depuis \`develop\`) : change la branche cible puis rouvre la PR."
          exit 1

  update:
    name: Branche à jour
    if: github.event_name == 'push' || contains(fromJSON('["develop", "master", "main"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - name: Prévenir les PR en retard sur leur branche cible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/mettre-a-jour-les-pr.sh "$NUMBER"
