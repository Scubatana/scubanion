name: Garde des pull requests

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
  push:
    branches: [master, main]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: garde-${{ github.event.pull_request.number || github.ref }}

jobs:
  base:
    name: Branche cible
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Refuser une PR qui ne vise ni main ni master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE" = "master" ] || [ "$BASE" = "main" ]; then
            exit 0
          fi
          gh pr close "$NUMBER" --comment "Cette PR vise \`$BASE\`. Les pull requests ne peuvent viser que \`master\` ou \`main\` : change la branche cible puis rouvre la PR."
          exit 1

  update:
    name: Mise à jour de la branche
    if: github.event_name == 'push' || github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - name: Mettre la ou les PR à jour avec leur branche cible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/mettre-a-jour-les-pr.sh "$NUMBER"
