sonar.projectKey=scubatana_scubanion
sonar.projectName=Scubanion
# Le firmware (scubatana.borne) n'est pas analysé ici : l'analyse C/C++ de SonarQube exige une base de compilation
# (compile_commands.json) et le compilateur de la carte dans le job, sinon elle échoue ou ignore les fichiers.
# Sa logique (jeton, messages MQTT, texte de l'écran) est couverte par pio test -e native dans GitHub Actions.
sonar.sources=scubatana.backend/app,scubatana.backend/config,scubatana.backend/routes,scubatana.frontend/components,scubatana.frontend/composables,scubatana.frontend/pages,scubatana.frontend/utils
sonar.tests=scubatana.backend/tests,scubatana.frontend/tests
sonar.exclusions=**/node_modules/**,**/vendor/**,**/.nuxt/**,**/android/**,**/coverage/**
sonar.php.coverage.reportPaths=scubatana.backend/coverage/clover.xml
sonar.javascript.lcov.reportPaths=scubatana.frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Le scanner attend le verdict du quality gate et échoue s'il est rouge (objectif O2 : aucun bug bloquant).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
