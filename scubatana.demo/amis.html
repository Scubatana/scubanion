<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Scubanion – Amis</title>
	<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
	<div class="phone">
		<div class="screen">
			<div class="tide"></div>
			<div class="topbar">
				<div class="brand">
					<img src="assets/img/logo.png" alt="Scubanion">
					<span>Amis</span>
				</div>
				<a class="avatar-btn" href="compte.html">
					<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6"/></svg>
				</a>
			</div>
			<div class="content">
				<div class="card" style="padding:8px 20px;">
					<div class="list-row">
						<div class="avatar" style="background:var(--coral);">H</div>
						<div>
							<div class="name">Hamza</div>
							<div class="sub">3 sorties cette semaine</div>
						</div>
						<div class="meta">
							<svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2L12 16.4 5.7 21l2.3-7.2-6-4.6h7.6z" fill="currentColor" stroke="none"/></svg>
							1 260
						</div>
					</div>
					<div class="list-row">
						<div class="avatar" style="background:var(--ocean);">T</div>
						<div>
							<div class="name">Thomas</div>
							<div class="sub">En équipe avec toi</div>
						</div>
						<div class="meta">
							<svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2L12 16.4 5.7 21l2.3-7.2-6-4.6h7.6z" fill="currentColor" stroke="none"/></svg>
							980
						</div>
					</div>
				</div>
				<a class="link-under" href="#">Voir plus d'amis</a>
				<div class="card" style="display:flex;flex-direction:column;gap:12px;">
					<span class="section-title">Inviter avec un code</span>
					<div class="invite-box">
						<input type="text" placeholder="Code : A17TQ2">
						<a class="btn btn-primary" href="#" style="width:auto;">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM19 19h2v2h-2z"/></svg>
						</a>
					</div>
				</div>
			</div>
			<div class="bottomnav">
				<a class="navitem" href="accueil.html">
					<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
					<span>Accueil</span>
				</a>
				<a class="navitem active" href="amis.html">
					<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.6"/><path d="M2 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M14.5 20c0-2.6 1.9-4.6 4.3-5"/></svg>
					<span>Amis</span>
				</a>
				<a class="navitem" href="chat.html">
					<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4V5z"/></svg>
					<span class="dot"></span>
					<span>Chat</span>
				</a>
				<a class="navitem" href="carte.html">
					<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M9 4l-6 2v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
					<span>Carte</span>
				</a>
				<a class="navitem" href="quetes.html">
					<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4"/><circle cx="12" cy="16.8" r="0.4" fill="currentColor"/></svg>
					<span>Quêtes</span>
				</a>
			</div>
		</div>
	</div>
	<script>
		if (window !== window.top) {
			document.documentElement.classList.add("embedded");
			document.body.classList.add("embedded");
			document.querySelector(".phone").classList.add("embedded");
		}
	</script>
</body>
</html>
