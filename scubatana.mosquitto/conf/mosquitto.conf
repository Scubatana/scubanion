listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/comptes/passwd
acl_file /mosquitto/comptes/acl

persistence true
persistence_location /mosquitto/data/

log_dest stderr
log_type error
log_type warning
log_type notice

# Listener TLS sur 8883, ajouté par demarrer.sh quand le certificat du serveur est fourni (voir docs/mqtt.md).
include_dir /mosquitto/config/conf.d
