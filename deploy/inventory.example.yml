# Copier en deploy/inventory.yml (ignoré par Git). Les valeurs viennent de l'environnement du poste qui lance Ansible.
production:
  hosts:
    scubatana_prod:
      ansible_host: "{{ lookup('env', 'DEPLOY_HOST') }}"
      ansible_user: "{{ lookup('env', 'DEPLOY_USER') | default('deploy', true) }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'DEPLOY_SSH_KEY_PATH') | default('~/.ssh/deploy_key', true) }}"
